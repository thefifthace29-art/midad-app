name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Android Platform Files
      run: flutter create . --org com.midad.app --project-name midad_app --platforms=android

    - name: Set App Label to Midad
      run: |
        sed -i 's/android:label="midad_app"/android:label="مِداد"/g' android/app/src/main/AndroidManifest.xml || true

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: midad-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
